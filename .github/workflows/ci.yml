name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: src

env:
  UBEM_WORKSPACE_ROOT: ${{ github.workspace }}/src

jobs:
  unit:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --extra dev
      - run: uv run pytest tests/ -m "not energyplus" -q

  integration:
    name: Integration tests (EnergyPlus ${{ matrix.eplus-ver }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          # Keep in sync with the defaults in .devcontainer/Dockerfile and config.py.
          - eplus-ver: "26.1.0"
            eplus-hash: "6f2e40d102"
            eplus-prefix: /app/software/EnergyPlusV26-1-0
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.12"
      - name: Prepare EnergyPlus directory
        run: |
          sudo mkdir -p "${{ matrix.eplus-prefix }}"
          sudo chown "$USER" "${{ matrix.eplus-prefix }}"
      - name: Cache EnergyPlus
        id: eplus-cache
        uses: actions/cache@v6
        with:
          path: ${{ matrix.eplus-prefix }}
          key: energyplus-${{ matrix.eplus-ver }}-${{ matrix.eplus-hash }}-ubuntu24.04
      - name: Install EnergyPlus
        if: steps.eplus-cache.outputs.cache-hit != 'true'
        run: |
          wget -q "https://github.com/NREL/EnergyPlus/releases/download/v${{ matrix.eplus-ver }}/EnergyPlus-${{ matrix.eplus-ver }}-${{ matrix.eplus-hash }}-Linux-Ubuntu24.04-x86_64.tar.gz" -O /tmp/eplus.tgz
          tar -xzf /tmp/eplus.tgz -C "${{ matrix.eplus-prefix }}" --strip-components=1
      - run: ${{ matrix.eplus-prefix }}/energyplus --version
      - run: uv sync --extra dev
      - run: uv run pytest tests/ -m energyplus -v
