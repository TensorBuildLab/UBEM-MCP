[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ubem-mcp-server"
version = "1.0.0"
description = "UBEM-MCP: urban building energy modeling data and simulation for AI assistants (MCP server, Python library and CLI), built on EnergyPlus"
authors = [{name = "Liang Zhang", email = "liangzhang1@arizona.edu"}, {name = "TensorBuildLab"}]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.10,<2",
    "eppy",
    "matplotlib",
    "networkx",
    "pandas",
    "plotly",
    "graphviz",
    "uvicorn[standard]",
    "python-dotenv",
    "shapely>=2.1",
    "pyproj>=3.6",
    "openpyxl>=3.1",
]
license = {text = "BSD-3-Clause-LBNL"}
keywords = ["EnergyPlus", "MCP", "server", "UBEM", "urban building energy modeling", "batch simulation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
]

[project.scripts]
ubem-mcp = "ubem_mcp_server.cli:main"

[project.urls]
homepage = "https://github.com/TensorBuildLab/UBEM-MCP"
repository = "https://github.com/TensorBuildLab/UBEM-MCP"
documentation = "https://github.com/TensorBuildLab/UBEM-MCP#readme"
issues = "https://github.com/TensorBuildLab/UBEM-MCP/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["ubem_mcp_server*"]

[tool.setuptools.package-data]
ubem_mcp_server = ["urban/data/*.json", "urban/data/README.md", "guides/*.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "energyplus: runs the real EnergyPlus engine (skipped when EnergyPlus is not installed)",
]

[project.optional-dependencies]
dev = [
    "ipykernel",
    "pytest",
    "pytest-cov",
    "pytest-asyncio",
    "black",
    "ruff",
    "mypy",
    "httpx",
    "asgi-lifespan",
]